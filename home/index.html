<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Fing · 홈</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/app/app.css" />
    <link rel="stylesheet" href="/src/app/home.css" />
  </head>
  <body>
    <div class="app">
      <div class="screen home">
        <header class="home__head">
          <h1 class="home__logo" id="home-logo"></h1>
          <button type="button" class="chip home__tracker" id="tracker-chip" aria-expanded="false" aria-controls="tracker-pop">트래커</button>
          <div class="home-pop" id="tracker-pop" role="dialog" aria-label="트래커 연결 상태" hidden></div>
        </header>

        <main class="home__main">
          <!-- 오늘의 파도 -->
          <section class="home__wave" aria-labelledby="wave-spot">
            <div class="home__wave-head">
              <div class="home__place">
                <p class="home__date" id="wave-date"></p>
                <h2 class="home__spot" id="wave-spot"></h2>
              </div>
              <span class="badge" id="wave-status"></span>
            </div>
            <div class="home__wave-body">
              <div class="home__metrics">
                <div class="home__height">
                  <span class="home__height-k">파고</span>
                  <span class="home__height-v"><b id="wave-height"></b><span class="home__unit">m</span></span>
                </div>
                <div class="home__fit" id="wave-fit" role="img">
                  <svg viewBox="0 0 92 92" aria-hidden="true">
                    <circle class="home__fit-track" cx="46" cy="46" r="41.5" />
                    <circle class="home__fit-bar" cx="46" cy="46" r="41.5" pathLength="100" />
                  </svg>
                  <span class="home__fit-text" aria-hidden="true"><b class="home__fit-num"></b><span>적합도</span></span>
                </div>
              </div>
              <ul class="home__weather" id="wave-weather"></ul>
              <p class="home__note" id="wave-note"></p>
            </div>
          </section>

          <!-- 나의 목표 -->
          <section class="home__card home__goal" aria-labelledby="goal-title">
            <div class="home__card-head">
              <h2 class="home__card-title" id="goal-title">나의 목표</h2>
              <button type="button" class="chip home__chip" id="goal-set">목표 설정</button>
            </div>
            <div class="home__goal-body">
              <p class="home__goal-main"><b id="goal-value"></b><span id="goal-unit"></span></p>
              <p class="home__goal-sub">나의 최고기록 기준</p>
            </div>
            <button type="button" class="button home__cta" id="record-start">지금 기록 시작하기</button>
          </section>

          <!-- 이전 최대 기록 -->
          <section class="home__card" aria-labelledby="best-title">
            <div class="home__card-head"><h2 class="home__card-title" id="best-title">이전 최대 기록</h2></div>
            <ul class="home__rows" id="best-list"></ul>
          </section>

          <!-- 최근 기록 -->
          <section class="home__card" aria-labelledby="recent-title">
            <div class="home__card-head">
              <h2 class="home__card-title home__recent-title" id="recent-title">최근 기록<span class="home__bar" aria-hidden="true"></span><span class="home__recent-k" id="recent-metric"></span></h2>
              <button type="button" class="chip home__chip" id="recent-set">설정</button>
            </div>
            <ul class="home__minis" id="recent-list" tabindex="0" aria-label="최근 기록 (옆으로 넘겨보기)"></ul>
          </section>
        </main>

        <nav id="tab"></nav>
      </div>
    </div>
    <script type="module" src="/src/app/home.js"></script>
  </body>
</html>
