<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fing</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <style>
      main { max-width: 560px; margin: 0 auto; padding: 80px 20px; }
      h1 { font-size: 32px; margin: 0 0 8px; }
      p { color: var(--color-txt-unselected); margin: 0 0 32px; line-height: 1.6; }
      a.card { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-radius: 16px;
        background: var(--color-btn-white); border: 1px solid var(--color-str-gray); color: inherit; text-decoration: none; font-weight: 600; }
      a.card:hover { border-color: var(--color-str-primary); color: var(--color-txt-primary); }
    </style>
  </head>
  <body>
    <main>
      <h1>Fing</h1>
      <p>피그마 디자인을 단계별로 퍼블리싱하는 프로젝트예요. 지금은 디자인시스템 구축 단계입니다.</p>
      <a class="card" href="./design-system/">디자인시스템 보기 <span>→</span></a>
    </main>
  </body>
</html>
